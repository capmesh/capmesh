governance:
  environment:
    - production
    - staging
  labels:
    framework: strands
    team: sre
  status: approved
  visibility: public
interface:
  endpoint: https://strands-perf.example.com
  protocol: a2a
metadata:
  api_version: capmesh.io/v1alpha1
  kind: agent
  name: strands-perf-analyzer
  namespace: performance
  owner: sre-team
  version: 1.2.0
provides:
  - capability: performance.analyze
    contract: v1
requires:
  - capability: repository.read
    contract: v1
  - capability: metrics.query
    contract: v1
