governance:
  environment:
    - production
  labels:
    framework: langgraph
    team: sre
  status: approved
  visibility: public
interface:
  endpoint: https://langgraph-incident.example.com
  protocol: a2a
metadata:
  api_version: capmesh.io/v1alpha1
  kind: agent
  name: langgraph-incident-responder
  namespace: reliability
  owner: sre-team
  version: 1.3.0
provides:
  - capability: incident.respond
    contract: v1
requires:
  - capability: metrics.query
    contract: v1
  - capability: notification.send
    contract: v1
