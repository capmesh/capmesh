governance:
  environment:
    - production
    - staging
    - development
  labels:
    framework: autogen
    team: platform
  status: approved
  visibility: public
interface:
  endpoint: https://autogen-refactor.example.com
  protocol: a2a
metadata:
  api_version: capmesh.io/v1alpha1
  kind: agent
  name: autogen-refactor-agent
  namespace: engineering
  owner: platform-team
  version: 1.1.0
provides:
  - capability: code.refactor
    contract: v1
requires:
  - capability: repository.read
    contract: v1
  - capability: test.generate
    contract: v1
