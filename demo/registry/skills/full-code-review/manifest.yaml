governance:
  environment:
    - production
    - staging
  labels:
    team: quality
  status: approved
  visibility: public
interface:
  assets: []
  instructions: SKILL.md
  protocol: skill
metadata:
  api_version: capmesh.io/v1alpha1
  kind: skill
  name: full-code-review
  namespace: quality
  owner: quality-team
  version: 1.0.0
provides:
  - capability: code.review
    contract: v1
requires:
  - capability: repository.read
    contract: v1
  - capability: code.quality
    contract: v1
  - capability: security.scan
    contract: v1
