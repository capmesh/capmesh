governance:
  environment:
    - production
    - staging
  labels:
    framework: langgraph
    team: security-engineering
  status: approved
  visibility: public
interface:
  endpoint: https://langgraph-security.example.com
  protocol: a2a
metadata:
  api_version: capmesh.io/v1alpha1
  kind: agent
  name: langgraph-security-reviewer
  namespace: security
  owner: security-engineering
  version: "2.4.0"
provides:
  - capability: security.code.review
    contract: v1
requires:
  - capability: repository.read
    contract: v1
