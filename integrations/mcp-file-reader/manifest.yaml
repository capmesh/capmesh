metadata:
  api_version: capmesh.io/v1alpha1
  kind: tool
  namespace: repository
  name: file-reader
  version: "1.0.0"
  owner: platform-team
provides:
  - capability: repository.read
    contract: v1
    description: Read files and list directories from local filesystem
  - capability: repository.list
    contract: v1
    description: List files in a directory with glob patterns
requires: []
interface:
  protocol: rest
  endpoint: http://localhost:9100
  auth_type: none
  request_mapping: {}
  response_mapping: {}
governance:
  status: approved
  visibility: public
