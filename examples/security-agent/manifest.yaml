metadata:
  api_version: capmesh.io/v1alpha1
  kind: agent
  namespace: security
  name: security-reviewer
  version: "2.4.0"
  owner: security-engineering
provides:
  - capability: security.code.review
    contract: v1
requires:
  - capability: repository.read
    contract: v1
interface:
  protocol: a2a
  endpoint: https://security-agent.example.com
governance:
  visibility: public
  status: approved
  environment:
    - production
    - staging
