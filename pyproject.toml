[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capmesh"
version = "1.0.0"
description = "Service discovery for the agentic world: dynamically discover and bind Agents, Skills and Tools by capability."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
semantic = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
mcp-server = [
    "mcp>=1.0",
]
all = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "mcp>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
]

[project.scripts]
capmesh = "capmesh.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/capmesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/capmesh"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
